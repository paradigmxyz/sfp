name: Leaderboard Benchmark

on:
  pull_request:
    types: [labeled]

jobs:
  benchmark:
    if: github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install --upgrade pip==26.2.2 && python -m pip install modal

      - name: Detect method name
        id: detect
        run: |
          # Look for new methods added to METHODS dict in methods.py
          METHOD=$(git diff origin/master...HEAD -- methods.py \
            | grep -oP '^\+\s*"(\w+)":\s' \
            | head -1 \
            | grep -oP '"\K\w+' || echo "")
          if [ -z "$METHOD" ]; then
            echo "No new method detected in methods.py, defaulting to naive"
            METHOD="naive"
          fi
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "Detected method: $METHOD"

      - name: Run benchmark on Modal (M=128)
        run: modal run scripts/modal_bench.py --method ${{ steps.detect.outputs.method }} --memory 128 --preset standard

      - name: Post results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const results = JSON.parse(fs.readFileSync('benchmark_results.json', 'utf8'));
              body = [
                '## 🏆 Leaderboard Benchmark Results\n',
                `**Method**: \`${results.method}\` | **Memory**: ${results.memory}\n`,
                '| Metric | Mean | Std |',
                '|--------|------|-----|',
                `| Score | ${results.score_mean.toFixed(4)} | ±${results.score_std.toFixed(4)} |`,
                `| Retention | ${results.retention_mean.toFixed(4)} | ±${results.retention_std.toFixed(4)} |`,
                `| Plasticity | ${results.plasticity_mean.toFixed(4)} | ±${results.plasticity_std.toFixed(4)} |`,
                '',
                `Seeds: 42, 43, 44 | Model: Qwen2.5-1.5B-Instruct | Tasks: math,code,ifeval,safety,domain | Steps: 2000/task | 3 orderings`,
                '',
                '<details><summary>Raw results</summary>\n',
                '```json',
                JSON.stringify(results, null, 2),
                '```',
                '</details>',
              ].join('\n');
            } catch (e) {
              body = '## ❌ Benchmark Failed\n\nThe benchmark run did not complete successfully. Check the [workflow logs](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                ') for details.';
            }

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Leaderboard Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
